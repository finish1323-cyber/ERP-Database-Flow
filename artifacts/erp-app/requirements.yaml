packages:
  "framer-motion": "For page transitions and premium micro-interactions"
  "recharts": "For the dashboard statistics visualization"
  "date-fns": "For formatting dates in the tables"
  "lucide-react": "For beautiful icons across the UI"
  "clsx": "Utility for constructing className strings"
  "tailwind-merge": "Utility for merging tailwind classes"
  "@hookform/resolvers": "For Zod form validation"
  "react-hook-form": "For robust form handling"

images:
  - path: "artifacts/erp-app/public/images/dashboard-bg.png"
    description: "Abstract minimal geometric background in deep indigo and slate colors, elegant professional enterprise feel, subtle gradients"
    aspect_ratio: "16:9"
  - path: "artifacts/erp-app/public/images/auth-bg.png"
    description: "Beautiful modern abstract mesh gradient background in clean blues and whites"
    aspect_ratio: "16:9"

notes:
  - The app uses standard Arabic right-to-left layout with dir="rtl"
  - Relies on @workspace/api-client-react for all data fetching
  - Uses Tailwind v4 and local logical properties for RTL spacing
